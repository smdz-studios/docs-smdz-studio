<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMDZ STUDIOS – FIVEM SCRIPT DOCUMENTATION</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Global announcement bar – content & style controlled from banner-config.js -->
  <div id="announcement-bar" class="announcement-bar">
    <span id="announcement-text" class="announcement-text"></span>
  </div>

  <!-- Page loader -->
  <div id="page-loader" class="page-loader">
    <div class="page-loader-inner">
      <div class="page-loader-logo">
        <img src="assets/logo.png" alt="SMDZ Studios Logo" />
      </div>
      <div class="page-loader-spinner"></div>
      <p class="page-loader-text">Preparing SMDZ Studios docs…</p>
    </div>
  </div>

  <!-- Native Reading Progress Bar -->
  <div id="reading-progress-container">
    <div id="reading-progress-bar"></div>
  </div>

  <div id="app" class="app-hidden">Loading SMDZ Studios documentation...</div>


  <button id="scroll-toggle-btn" class="scroll-toggle-btn" type="button">
    ↓
  </button>


  <script>
    window.$docsify = {
      name: 'SMDZ Studios',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      autoHeader: true,
      coverpage: false,
      themeColor: '#509205',
      maxLevel: 4,
      homepage: 'portal.md',

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search SMDZ scripts...',
        noData: 'No results for this query.',
        depth: 4,
        hideOtherSidebarContent: true
      },

      alias: {
        '/_sidebar.md': '/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      plugins: [
        function (hook, vm) {
          var collapseConfig = {
            defaultCollapsed: true,
            minLines: 8
          };

          function getCodeLanguage(preEl) {
            if (!preEl) {
              return 'text';
            }

            var dataLang = preEl.getAttribute('data-lang');
            if (dataLang && dataLang.trim() !== '') {
              return dataLang.trim().toLowerCase();
            }

            var codeEl = preEl.querySelector('code');
            if (!codeEl || !codeEl.className) {
              return 'text';
            }

            var match = codeEl.className.match(/language-([\w-]+)/i);
            return match && match[1] ? match[1].toLowerCase() : 'text';
          }

          function normalizeLanguage(preEl, lang) {
            if (preEl && lang && lang !== '') {
              preEl.setAttribute('data-lang', lang.toUpperCase());
            }
          }

          function getLineCount(preEl) {
            var codeEl = preEl.querySelector('code');
            if (!codeEl) {
              return 0;
            }

            var text = codeEl.textContent || '';
            if (text === '') {
              return 0;
            }

            return text.split(/\r\n|\r|\n/).length;
          }

          function updateToggleState(preEl, toggleBtn, wrapper, isCollapsed) {
            if (!preEl || !toggleBtn || !wrapper) {
              return;
            }

            if (isCollapsed) {
              preEl.classList.add('is-collapsed');
              wrapper.classList.add('code-collapsed');
              toggleBtn.textContent = 'Show code';
              toggleBtn.setAttribute('aria-expanded', 'false');
            } else {
              preEl.classList.remove('is-collapsed');
              wrapper.classList.remove('code-collapsed');
              toggleBtn.textContent = 'Hide code';
              toggleBtn.setAttribute('aria-expanded', 'true');
            }
          }

          function bindCodeCollapsers() {
            var codeBlocks = document.querySelectorAll('.markdown-section pre');
            if (!codeBlocks || codeBlocks.length === 0) {
              return;
            }

            codeBlocks.forEach(function (preEl) {
              if (preEl.dataset.collapsibleBound === '1') {
                return;
              }

              var lineCount = getLineCount(preEl);
              if (lineCount < collapseConfig.minLines) {
                return;
              }

              var lang = getCodeLanguage(preEl);
              normalizeLanguage(preEl, lang);

              var wrapper = document.createElement('div');
              wrapper.className = 'code-collapse-wrapper';
              preEl.parentNode.insertBefore(wrapper, preEl);
              wrapper.appendChild(preEl);

              var controls = document.createElement('div');
              controls.className = 'code-collapse-controls';

              var toggleBtn = document.createElement('button');
              toggleBtn.type = 'button';
              toggleBtn.className = 'code-collapse-toggle';
              toggleBtn.setAttribute('aria-label', 'Toggle code visibility');

              controls.appendChild(toggleBtn);
              wrapper.appendChild(controls);

              var isCollapsed = collapseConfig.defaultCollapsed;
              updateToggleState(preEl, toggleBtn, wrapper, isCollapsed);

              toggleBtn.addEventListener('click', function () {
                isCollapsed = !isCollapsed;
                updateToggleState(preEl, toggleBtn, wrapper, isCollapsed);
              });

              preEl.dataset.collapsibleBound = '1';
            });
          }

          hook.doneEach(function () {
            requestAnimationFrame(bindCodeCollapsers);
          });
        },

        function (hook, vm) {
          hook.doneEach(function () {
            var sidebarParent = document.querySelector('.sidebar');
            var nav = document.querySelector('.sidebar-nav');
            if (sidebarParent && nav && !document.querySelector('.brand-header')) {
              var header = document.createElement('div');
              header.className = 'brand-header';
              header.innerHTML =
                '<div class="sidebar-logo-wrapper">' +
                  '<img src="assets/logo.png" alt="SMDZ Studios Logo" />' +
                '</div>' +
                '<div class="sidebar-menu-label"><strong>MENU</strong></div>';
              sidebarParent.insertBefore(header, sidebarParent.firstChild);
            }
          });
        },

        function (hook, vm) {
          hook.afterEach(function (html, next) {
            var footerHtml =
              '<div class="smdz-footer">' +
                '© 2025 - 2026 SMDZ Studios · All rights reserved · Not affiliated with R* Games<br />' +
                'Made with 💚 by SMDZ Studios' +
                '<div class="smdz-footer-logos">' +
                  '<img src="assets/smdz.png" alt="SMDZ Studios" />' +
                  '<img src="assets/cfx.png" alt="Cfx.re" />' +
                  '<img src="assets/esx.png" alt="ESX" />' +
                  '<img src="assets/qbcore.png" alt="QBCore" />' +
                  '<img src="assets/qbox.png" alt="Qbox" />' +
                '</div>' +
                '<div class="smdz-footer-links">' +
                  '<a href="https://discord.gg/tA43awBqAN" target="_blank" class="footer-icon-link" title="Join our Discord">' +
                    '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.317 4.369A19.791 19.791 0 0 0 15.885 3c-.191.328-.404.769-.554 1.115a18.273 18.273 0 0 0-5.487 0A11.64 11.64 0 0 0 9.29 3a19.736 19.736 0 0 0-4.434 1.372C2.052 8.579 1.29 12.682 1.669 16.728a19.924 19.924 0 0 0 5.427 2.735c.44-.602.832-1.236 1.167-1.907a12.955 12.955 0 0 1-1.83-.871c.154-.113.305-.23.451-.351 3.53 1.658 7.368 1.658 10.855 0 .149.121.3.238.451.351-.585.34-1.197.631-1.83.871.335.671.727 1.305 1.167 1.907a19.908 19.908 0 0 0 5.429-2.737c.444-4.7-.76-8.766-3.51-12.357ZM8.02 14.248c-1.055 0-1.92-.968-1.92-2.16 0-1.192.848-2.16 1.92-2.16 1.08 0 1.936.978 1.92 2.16 0 1.192-.849 2.16-1.92 2.16Zm7.96 0c-1.056 0-1.92-.968-1.92-2.16 0-1.192.848-2.16 1.92-2.16 1.08 0 1.936.978 1.92 2.16 0 1.192-.849 2.16-1.92 2.16Z"></path></svg>' +
                  '</a>' +
                  '<a href="https://smdz-studios.tebex.io/" target="_blank" class="footer-icon-link" title="Visit our Store">' +
                    '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 4.75A1.75 1.75 0 0 1 4.75 3h14.5A1.75 1.75 0 0 1 21 4.75v1.5A3.75 3.75 0 0 1 17.25 10H17v8.25A1.75 1.75 0 0 1 15.25 20h-6.5A1.75 1.75 0 0 1 7 18.25V10h-.25A3.75 3.75 0 0 1 3 6.25v-1.5Zm5.5 5.25v8h7V10h-7Zm-4-3.75v.5A2.25 2.25 0 0 0 6.75 9H7V4.5h-2.25A.25.25 0 0 0 4.5 4.75v1.5Zm4 0V9h7V6.25h-7Zm8.5 0V9h.25a2.25 2.25 0 0 0 2.25-2.25v-1.5a.25.25 0 0 0-.25-.25H17v1.25Z"></path></svg>' +
                  '</a>' +
                '</div>' +
              '</div>';
            next(html + footerHtml);
          });
        }
      ],
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>

  <!-- Docsify core (AFTER window.$docsify) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Official Docsify plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Navigation & Progress plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- Prism languages -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>


  <script src="banner-config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('scroll-toggle-btn');
      var app = document.getElementById('app');
      var loader = document.getElementById('page-loader');

      function updateAnnouncementOffset(barEl) {
        var root = document.documentElement;
        if (!barEl || barEl.style.display === 'none') {
          root.style.setProperty('--announcement-offset', '0px');
          document.body.classList.remove('has-announcement-bar');
          return;
        }

        var barHeight = Math.ceil(barEl.getBoundingClientRect().height);
        if (barHeight > 0) {
          root.style.setProperty('--announcement-offset', barHeight + 'px');
          document.body.classList.add('has-announcement-bar');
        } else {
          root.style.setProperty('--announcement-offset', '0px');
          document.body.classList.remove('has-announcement-bar');
        }
      }


      if (btn) {
        function isAtBottom() {
          return window.innerHeight + window.scrollY >= document.body.offsetHeight - 4;
        }

        function updateButtonState() {
          if (isAtBottom()) {
            btn.textContent = '↑';
            btn.setAttribute('data-direction', 'up');
          } else {
            btn.textContent = '↓';
            btn.setAttribute('data-direction', 'down');
          }
        }

        btn.addEventListener('click', function () {
          if (btn.getAttribute('data-direction') === 'up') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          }
        });

        window.addEventListener('scroll', updateButtonState);
        window.addEventListener('resize', updateButtonState);
        updateButtonState();
      }


      if (window.SMDZ_BANNER_CONFIG) {
        var bar = document.getElementById('announcement-bar');
        if (bar) {
          var cfg = window.SMDZ_BANNER_CONFIG;

          if (!cfg.enabled) {
            bar.style.display = 'none';
            updateAnnouncementOffset(bar);
          } else {

            if (cfg.type) {
              bar.classList.add('announcement-type-' + cfg.type);
            }


            if (cfg.layout === 'compact') {
              bar.classList.add('announcement-layout-compact');
            }


            if (cfg.align === 'left') {
              bar.classList.add('announcement-align-left');
            } else {
              bar.classList.add('announcement-align-center');
            }


            var inner = document.createElement('div');
            inner.className = 'announcement-inner';

            var content = document.createElement('div');
            content.className = 'announcement-content';

            if (cfg.icon) {
              var icon = document.createElement('span');
              icon.className = 'announcement-icon';
              icon.textContent = cfg.icon;
              content.appendChild(icon);
            }

            var textBlock = document.createElement('div');
            textBlock.className = 'announcement-text-block';

            if (cfg.title) {
              var title = document.createElement('div');
              title.className = 'announcement-title';
              title.textContent = cfg.title;
              textBlock.appendChild(title);
            }

            if (cfg.subtitle) {
              var subtitle = document.createElement('div');
              subtitle.className = 'announcement-subtitle';
              subtitle.innerHTML = cfg.subtitle;
              textBlock.appendChild(subtitle);
            }

            content.appendChild(textBlock);
            inner.appendChild(content);


            if (cfg.cta && cfg.cta.enabled && cfg.cta.label && cfg.cta.url) {
              var cta = document.createElement('a');
              cta.className = 'announcement-cta';
              cta.href = cfg.cta.url;
              cta.target = cfg.cta.target || '_blank';
              cta.rel = 'noopener';
              cta.textContent = cfg.cta.label;
              inner.appendChild(cta);
            }


            bar.innerHTML = '';
            bar.appendChild(inner);

            requestAnimationFrame(function () {
              bar.classList.add('announcement-visible');
              updateAnnouncementOffset(bar);
            });

            window.addEventListener('resize', function () {
              updateAnnouncementOffset(bar);
            });
          }
        }
      }


      setTimeout(function () {
        if (loader) {
          loader.classList.add('page-loader-hidden');
        }
        if (app) {
          app.classList.remove('app-hidden');
        }
      }, 3000);

      // Native Reading Progress Bar Logic
      var progressBar = document.getElementById('reading-progress-bar');
      window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var scrolled = (winScroll / height) * 100;
        if (progressBar) {
          progressBar.style.width = scrolled + '%';
        }
      });
    });
  </script>
</body>
</html>
