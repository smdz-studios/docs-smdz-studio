        var root = document.documentElement;
        var announcementBar = document.getElementById('announcement-bar');
        var saleBanner = document.getElementById('sale-banner');
        var announcementHeight = getVisibleBarHeight(announcementBar);
        var saleHeight = getVisibleBarHeight(saleBanner);
        var totalHeight = announcementHeight + saleHeight;

        root.style.setProperty('--announcement-offset', totalHeight + 'px');
        root.style.setProperty('--top-bars-offset', totalHeight + 'px');
        root.style.setProperty('--sale-banner-top', announcementHeight + 'px');

        if (totalHeight > 0) {
          document.body.classList.add('has-announcement-bar');
        } else {
          document.body.classList.remove('has-announcement-bar');
        }
      }


      if (btn) {
        function isAtBottom() {
          return window.innerHeight + window.scrollY >= document.body.offsetHeight - 4;
        }

        function updateButtonState() {
          if (isAtBottom()) {
            btn.textContent = '↑';
            btn.setAttribute('data-direction', 'up');
          } else {
            btn.textContent = '↓';
            btn.setAttribute('data-direction', 'down');
          }
        }

        btn.addEventListener('click', function () {
          if (btn.getAttribute('data-direction') === 'up') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          }
        });

        window.addEventListener('scroll', updateButtonState);
        window.addEventListener('resize', updateButtonState);
        updateButtonState();
      }


      if (window.SMDZ_BANNER_CONFIG) {
        var bar = document.getElementById('announcement-bar');
        if (bar) {
          var cfg = window.SMDZ_BANNER_CONFIG;

          if (!cfg.enabled) {
            bar.style.display = 'none';
            updateTopBarsOffset();
          } else {

            if (cfg.type) {
              bar.classList.add('announcement-type-' + cfg.type);
            }


            if (cfg.layout === 'compact') {
              bar.classList.add('announcement-layout-compact');
            }


            if (cfg.align === 'left') {
              bar.classList.add('announcement-align-left');
            } else {
              bar.classList.add('announcement-align-center');
            }


            var inner = document.createElement('div');
            inner.className = 'announcement-inner';

            var content = document.createElement('div');
            content.className = 'announcement-content';

            if (cfg.icon && cfg.icon.indexOf('ð') === -1 && cfg.icon.indexOf('â') === -1) {
              var icon = document.createElement('span');
              icon.className = 'announcement-icon';
              icon.textContent = cfg.icon;
              content.appendChild(icon);
            }

            var textBlock = document.createElement('div');
            textBlock.className = 'announcement-text-block';

            if (cfg.title) {
              var title = document.createElement('div');
              title.className = 'announcement-title';
              title.textContent = cfg.title;
              textBlock.appendChild(title);
            }

            if (cfg.subtitle) {
              var subtitle = document.createElement('div');
              subtitle.className = 'announcement-subtitle';
              subtitle.innerHTML = cfg.subtitle;
              textBlock.appendChild(subtitle);
            }

            content.appendChild(textBlock);
            inner.appendChild(content);


            if (cfg.cta && cfg.cta.enabled && cfg.cta.label && cfg.cta.url) {
              var cta = document.createElement('a');
              cta.className = 'announcement-cta';
              cta.href = cfg.cta.url;
              cta.target = cfg.cta.target || '_blank';
              cta.rel = 'noopener';
              cta.textContent = cfg.cta.label;
              inner.appendChild(cta);
            }


            bar.innerHTML = '';
            bar.appendChild(inner);

            requestAnimationFrame(function () {
              bar.classList.add('announcement-visible');
              updateTopBarsOffset();
            });

            window.addEventListener('resize', function () {
              updateTopBarsOffset();
            });
          }
        }
      }

      if (window.SMDZ_SALE_BANNER_CONFIG) {
        var saleBar = document.getElementById('sale-banner');
        if (saleBar) {
          var saleCfg = window.SMDZ_SALE_BANNER_CONFIG;

          if (!saleCfg.enabled) {
            saleBar.style.display = 'none';
            updateTopBarsOffset();
          } else {
            var saleText = saleCfg.text || '';
            var saleSeparator = saleCfg.separator || 'SALE';
            var saleItems = [];

            for (var saleIndex = 0; saleIndex < 8; saleIndex += 1) {
              saleItems.push('<span class="sale-banner-item">' + saleText + '</span>');
              saleItems.push('<span class="sale-banner-separator">' + saleSeparator + '</span>');
            }

            var saleTrack = saleBar.querySelector('.sale-banner-track');
            if (saleTrack) {
              saleTrack.innerHTML = saleItems.join('');
              saleTrack.style.setProperty('--sale-banner-speed', (saleCfg.speedSeconds || 22) + 's');
            }

            if (saleCfg.url) {
              saleBar.setAttribute('role', 'link');
              saleBar.tabIndex = 0;
              saleBar.addEventListener('click', function () {
                window.open(saleCfg.url, saleCfg.target || '_blank', 'noopener');
              });
              saleBar.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault();
                  window.open(saleCfg.url, saleCfg.target || '_blank', 'noopener');
                }
              });
            }

            requestAnimationFrame(function () {
              saleBar.classList.add('sale-banner-visible');
              updateTopBarsOffset();
            });

            window.addEventListener('resize', updateTopBarsOffset);
          }
        }
      }

      window.addEventListener('load', function () {
        window.setTimeout(hidePageLoader, 250);
      });

      window.setTimeout(hidePageLoader, 1200);

      // Native Reading Progress Bar Logic
      var progressBar = document.getElementById('reading-progress-bar');
      window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var scrolled = (winScroll / height) * 100;
        if (progressBar) {
          progressBar.style.width = scrolled + '%';
        }
      });
    });
  </script>
</body>
</html>
