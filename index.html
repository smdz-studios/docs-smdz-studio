            var match = codeEl.className.match(/language-([\w-]+)/i);

              }

              var lineCount = getLineCount(preEl);
              if (lineCount < collapseConfig.minLines) {
                return;
              }

              var lang = getCodeLanguage(preEl);
              normalizeLanguage(preEl, lang);

              var wrapper = document.createElement('div');
              wrapper.className = 'code-collapse-wrapper';
              preEl.parentNode.insertBefore(wrapper, preEl);
              wrapper.appendChild(preEl);

              var controls = document.createElement('div');
              controls.className = 'code-collapse-controls';

              var toggleBtn = document.createElement('button');
              toggleBtn.type = 'button';
              toggleBtn.className = 'code-collapse-toggle';
              toggleBtn.setAttribute('aria-label', 'Toggle code visibility');

              controls.appendChild(toggleBtn);
              wrapper.appendChild(controls);

              var isCollapsed = collapseConfig.defaultCollapsed;
              updateToggleState(preEl, toggleBtn, wrapper, isCollapsed);

              toggleBtn.addEventListener('click', function () {
                isCollapsed = !isCollapsed;
                updateToggleState(preEl, toggleBtn, wrapper, isCollapsed);
              });

              preEl.dataset.collapsibleBound = '1';
            });
          }

          hook.doneEach(function () {
            requestAnimationFrame(bindCodeCollapsers);
          });
        },

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('scroll-toggle-btn');
      var app = document.getElementById('app');
      var loader = document.getElementById('page-loader');
      var loaderHidden = false;

      function hidePageLoader() {
        if (loaderHidden) {
          return;
        }

        loaderHidden = true;

        if (loader) {
          loader.classList.add('page-loader-hidden');
        }

        if (app) {
          app.classList.remove('app-hidden');
        }
      }

      function updateAnnouncementOffset(barEl) {
        var root = document.documentElement;
        if (!barEl || barEl.style.display === 'none') {
          root.style.setProperty('--announcement-offset', '0px');
          document.body.classList.remove('has-announcement-bar');
          return;
        }

        var barHeight = Math.ceil(barEl.getBoundingClientRect().height);
        if (barHeight > 0) {
          root.style.setProperty('--announcement-offset', barHeight + 'px');
          document.body.classList.add('has-announcement-bar');
        } else {
          root.style.setProperty('--announcement-offset', '0px');
          document.body.classList.remove('has-announcement-bar');
        }
      }


      if (btn) {
        function isAtBottom() {
          return window.innerHeight + window.scrollY >= document.body.offsetHeight - 4;
        }

        function updateButtonState() {
          if (isAtBottom()) {
            btn.textContent = '↑';
            btn.setAttribute('data-direction', 'up');
          } else {
            btn.textContent = '↓';
            btn.setAttribute('data-direction', 'down');
          }
        }

        btn.addEventListener('click', function () {
          if (btn.getAttribute('data-direction') === 'up') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          }
        });

        window.addEventListener('scroll', updateButtonState);
        window.addEventListener('resize', updateButtonState);
        updateButtonState();
      }


      if (window.SMDZ_BANNER_CONFIG) {
        var bar = document.getElementById('announcement-bar');
        if (bar) {
          var cfg = window.SMDZ_BANNER_CONFIG;

          if (!cfg.enabled) {
            bar.style.display = 'none';
            updateAnnouncementOffset(bar);
          } else {

            if (cfg.type) {
              bar.classList.add('announcement-type-' + cfg.type);
            }


            if (cfg.layout === 'compact') {
              bar.classList.add('announcement-layout-compact');
            }


            if (cfg.align === 'left') {
              bar.classList.add('announcement-align-left');
            } else {
              bar.classList.add('announcement-align-center');
            }


            var inner = document.createElement('div');
            inner.className = 'announcement-inner';

            var content = document.createElement('div');
            content.className = 'announcement-content';

            if (cfg.icon) {
              var icon = document.createElement('span');
              icon.className = 'announcement-icon';
              icon.textContent = cfg.icon;
              content.appendChild(icon);
            }

            var textBlock = document.createElement('div');
            textBlock.className = 'announcement-text-block';

            if (cfg.title) {
              var title = document.createElement('div');
              title.className = 'announcement-title';
              title.textContent = cfg.title;
              textBlock.appendChild(title);
            }

            if (cfg.subtitle) {
              var subtitle = document.createElement('div');
              subtitle.className = 'announcement-subtitle';
              subtitle.innerHTML = cfg.subtitle;
              textBlock.appendChild(subtitle);
            }

            content.appendChild(textBlock);
            inner.appendChild(content);


            if (cfg.cta && cfg.cta.enabled && cfg.cta.label && cfg.cta.url) {
              var cta = document.createElement('a');
              cta.className = 'announcement-cta';
              cta.href = cfg.cta.url;
              cta.target = cfg.cta.target || '_blank';
              cta.rel = 'noopener';
              cta.textContent = cfg.cta.label;
              inner.appendChild(cta);
            }


            bar.innerHTML = '';
            bar.appendChild(inner);

            requestAnimationFrame(function () {
              bar.classList.add('announcement-visible');
              updateAnnouncementOffset(bar);
            });

            window.addEventListener('resize', function () {
              updateAnnouncementOffset(bar);
            });
          }
        }
      }

      window.addEventListener('load', function () {
        window.setTimeout(hidePageLoader, 250);
      });

      window.setTimeout(hidePageLoader, 1200);

      // Native Reading Progress Bar Logic
      var progressBar = document.getElementById('reading-progress-bar');
      window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var scrolled = (winScroll / height) * 100;
        if (progressBar) {
          progressBar.style.width = scrolled + '%';
        }
      });
    });
  </script>
